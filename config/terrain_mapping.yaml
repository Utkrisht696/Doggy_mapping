# Initial terrain classification limits, not certified Go2 capabilities.
# The XY ground reference is learned from observed nearby floor returns.
/**:
  ros__parameters:
    resolution: 0.05
    vertical_resolution: 0.03
    terrain_cell_size: 0.25
    min_observations: 2
    sensor_range: 10.0
    max_extent: 80.0
    max_voxels: 600000
    ground_tolerance: 0.08
    obstacle_min_height: 0.15
    obstacle_max_height: 1.0
    slope_cost_start_deg: 8.0
    slope_block_deg: 20.0
    roughness_cost_start: 0.02
    roughness_block: 0.06
    step_height: 0.12
    ground_connect_slope_deg: 40.0
    seed_min_below_imu: 0.15
    seed_max_below_imu: 0.85
    seed_radius: 1.25
    fit_radius: 2
    fit_min_cells: 6
    publish_period: 1.0
    # Pose the official collision geometry using measured scan-time joints.
    self_filter_padding: 0.025
    self_filter_max_joint_gap: 0.15
    self_filter_max_joint_age: 0.075
    # Separate display layer, matching the approved higher-return diagnostic.
    wall_min_body_z: -0.05
