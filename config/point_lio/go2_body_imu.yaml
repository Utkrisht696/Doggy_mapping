# Go2 body-IMU profile: independently validated gyro gain and fixed residual bias.
# Offline evidence: reports/point_lio_diagnosis_20261018/FINAL_REPORT.md.
# L1 model identification remains provisional. Acceleration/noise/saturation
# settings otherwise retain upstream values; this is not a full noise calibration.
# imu_time_inte is nominal; original source/per-point timestamps are preserved.
# time_lag_imu_to_lidar=0.0 remains an uncalibrated acquisition-time correction.
/**:
  ros__parameters:
    common:
      lid_topic: /utlidar/cloud
      imu_topic: /doggy/imu/body_calibrated
      con_frame: false
      con_frame_num: 1
      cut_frame: false
      cut_frame_time_interval: 0.1
      time_lag_imu_to_lidar: 0.0
    preprocess:
      lidar_type: 5
      scan_line: 18
      timestamp_unit: 0
      blind: 0.5
    mapping:
      imu_en: true
      start_in_aggressive_motion: false
      extrinsic_est_en: false
      imu_time_inte: 0.004
      satu_acc: 30.0
      satu_gyro: 35.0
      acc_norm: 9.81
      lidar_meas_cov: 0.01
      acc_cov_output: 500.0
      gyr_cov_output: 1000.0
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0
      gyro_bias_initial_variance: 0.0
      imu_meas_acc_cov: 0.1
      imu_meas_omg_cov: 0.0001
      gyr_cov_input: 0.01
      acc_cov_input: 0.1
      plane_thr: 0.1
      match_s: 81.0
      fov_degree: 180.0
      det_range: 100.0
      gravity_align: true
      gravity:
      - 0.0
      - 0.0
      - -9.81
      gravity_init:
      - 0.0
      - 0.0
      - -9.81
      extrinsic_T:
      - 0.3077300286681313
      - 1.994733730970033e-08
      - -0.04232001537438999
      extrinsic_R:
      - 0.5261139017353029
      - -0.8101358157255057
      - 0.2586196482860969
      - -0.8386681734567218
      - -0.5446427221842449
      - 1.5814066921490184e-06
      - 0.14085402809867137
      - -0.21689690004816572
      - -0.9659792324464709
    odometry:
      publish_odometry_without_downsample: false
    publish:
      path_en: true
      scan_publish_en: true
      scan_bodyframe_pub_en: false
    pcd_save:
      pcd_save_en: false
      interval: -1
    use_imu_as_input: false
    prop_at_freq_of_imu: true
    check_satu: true
    init_map_size: 4000
    point_filter_num: 1
    space_down_sample: true
    filter_size_surf: 0.1
    filter_size_map: 0.1
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
